name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    # Offline host tests only; never touches a device or the ESP-IDF toolchain.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep libssl-dev clang
          python3 -m pip install --user --break-system-packages \
            -r device/ESP32P4/firmware/v0.86.6-dev/tests/host/requirements.txt
      - name: scripts/check-all.sh
        run: ./scripts/check-all.sh
