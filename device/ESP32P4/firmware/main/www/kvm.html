<style>

.screen-pad{position:absolute;inset:0;cursor:crosshair;outline:none}.cursor{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--green);border:1px solid white;transform:translate(-50%,-50%);pointer-events:none;opacity:0}
.side{border-left:1px solid var(--line);background:#121419;padding:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden auto;min-width:0}.panel{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px}.panel h2{font-size:13px;margin:0 0 10px;color:#dce1e8}.row{display:flex;justify-content:space-between;gap:12px;color:var(--muted);padding:7px 0;border-bottom:1px solid #242832}.row:last-child{border-bottom:0}.row b{color:var(--text);font-weight:650;text-align:right;word-break:break-word}

.joy-thumb{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;border:1px solid #6b7280;background:#d8dee8;box-shadow:0 8px 18px rgba(0,0,0,.35);transform:translate(-50%,-50%);pointer-events:none}
.touchpad{position:relative;height:156px;border:1px solid #3a404b;border-radius:8px;background:#1b2028;touch-action:none;overflow:hidden;outline:none}.touchpad:before{content:"触控板";position:absolute;inset:0;display:grid;place-items:center;color:#687180;font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0}.touchpad.locked{border-color:#1f766d;cursor:none;background:#172522}
.touch-dot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--green);border:1px solid white;transform:translate(-50%,-50%);opacity:0;pointer-events:none}.mouse-speed{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;align-items:center;gap:8px;color:var(--muted);font-size:12px}input[type=range]{width:100%;accent-color:var(--green)}
.mouse-buttons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.mouse-buttons.three{grid-template-columns:repeat(3,minmax(0,1fr))}.mouse-buttons button{min-width:0;padding:8px 4px;font-size:12px}

.text-input{width:100%;min-height:92px;resize:vertical;border:1px solid #3a404b;border-radius:8px;background:#0e1014;color:var(--text);padding:10px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;outline:none}.text-input:focus{border-color:#1f766d;box-shadow:0 0 0 2px rgba(45,212,191,.25)}.text-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.text-actions button{min-width:0;padding:8px 4px;font-size:12px}.text-msg{min-height:18px;margin-top:8px;color:var(--muted);font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}.text-msg.ok{color:var(--green)}.text-msg.bad{color:var(--red)}.text-msg.warn{color:var(--yellow)}
.keys{display:grid;gap:5px;min-width:0}.keyrow{display:flex;gap:5px;min-width:0}.key{flex:1 1 0;min-width:0;height:32px;padding:0 3px;font-size:10px;white-space:nowrap;overflow:hidden}.wide{flex:3 1 0}.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,6,8,.72);z-index:20;padding:18px}.modal.show{display:grid}.dialog{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.45)}.dialog h2{font-size:16px;margin:0 0 6px}.dialog p{margin:0 0 14px;color:var(--muted)}.dialog .field{display:grid;gap:6px;margin-bottom:10px}.dialog label{font-size:12px;color:var(--muted)}.dialog input{width:100%;border:1px solid var(--line);background:#0e1014;color:var(--text);border-radius:6px;padding:11px 12px;font:15px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace}.dialog input:focus{outline:2px solid rgba(45,212,191,.35);border-color:#1f766d}.dialog .msg{min-height:20px;color:var(--muted);margin-top:10px}.dialog .msg.bad{color:var(--red)}.dialog .msg.ok{color:var(--green)}
@media(max-width:900px){body{overflow:hidden}.top{height:auto;align-items:flex-start;flex-direction:column;padding:12px;gap:10px}.status-strip{justify-content:flex-start;margin-left:0}.toolbar{height:auto;align-items:flex-start;flex-direction:column;padding:10px}.combos{display:none}.stage{height:calc(100vh - 154px);grid-template-columns:1fr;grid-template-rows:minmax(220px,50vh) minmax(0,1fr);gap:12px;padding:12px}.side{border-left:0;border-top:1px solid var(--line);min-height:0}}

</head>
<body>
<nav class="top">
  <div class="brand"><div class="logo">EA</div><div><div class="title">ExoAnchor ESP32-P4</div><div id="deviceLabelText" class="sub">ESP32-P4</div></div></div>

</nav>
<div class="toolbar">

  <div class="combos"><button data-combo="ctrl-alt-del">Ctrl Alt Del</button><button data-combo="alt-tab">Alt Tab</button><button data-combo="alt-f4">Alt F4</button><button data-combo="win">Win</button><button data-combo="print-screen">PrtSc</button><button data-hold-key="ControlLeft">Hold Ctrl</button><button data-hold-key="AltLeft">Hold Alt</button><button data-hold-key="MetaLeft">Hold Win</button><button data-hold-key="ShiftLeft">Hold Shift</button></div>
  <div class="right"><select id="resolutionSelect"></select><button id="syncPointer" title="Move the absolute pointer to the hovered video position">Sync</button><button id="snapshot">Snapshot</button><button id="release">Release</button><button id="reload">Reload</button><button id="fs">Fullscreen</button></div>
</div>
<main class="stage">
  <section id="screen" class="screen">
    <img id="video" alt="">
    <div id="nosignal" class="nosignal"><div><b>No Video</b><div id="videoText">waiting for USB UVC frame</div></div></div>
    <div id="screenPad" class="screen-pad" tabindex="0"></div>
    <div id="cursor" class="cursor"></div>
  </section>
  <aside class="side">
    <div class="panel">
      <h2>输入</h2>
      <div class="capture-row"><span>键盘直通</span><label class="switch-control"><input id="keyboardPassthrough" type="checkbox" role="switch" aria-label="键盘直通"><span class="switch-track"><span class="switch-thumb"></span></span><span id="keyboardPassthroughText" class="switch-text">关闭</span></label></div>
      <div class="capture-row"><span>Direct Click</span><label class="switch-control"><input id="directClickToggle" type="checkbox" role="switch" aria-label="Direct Click"><span class="switch-track"><span class="switch-thumb"></span></span><span id="directClickText" class="switch-text">关闭</span></label></div>
      <div id="keyboardCaptureMsg" class="capture-msg">待机</div>
      <textarea id="textInput" class="text-input" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      <div class="text-actions"><button id="pasteText" type="button">粘贴</button><button id="sendText" class="active" type="button">发送</button><button id="clearText" type="button">清空</button></div>
      <div id="textMsg" class="text-msg"></div>
    </div>
    <div class="panel">
      <h2>鼠标</h2>
      <div class="mouse-tabs"><button id="modeJoy" data-mode="joy">摇杆</button><button id="modeTouch" class="active" data-mode="touch">触控板</button></div>
      <div id="joyPane" class="mouse-pane hide"><div id="joystick" class="joystick" tabindex="0"><div class="joy-axis"></div><div id="joyThumb" class="joy-thumb"></div></div></div>
      <div id="touchPane" class="mouse-pane"><div id="touchPad" class="touchpad" tabindex="0"><span id="touchDot" class="touch-dot"></span></div></div>
      <div class="mouse-speed"><span>速度</span><input id="mouseSpeed" type="range" min="1" max="10" value="5"><b id="speedText">5</b></div>
      <div class="mouse-buttons three"><button data-mouse-button="0">左键</button><button data-mouse-button="1">中键</button><button data-mouse-button="2">右键</button></div>
      <div class="mouse-buttons"><button id="dragLock">拖拽</button><button data-mouse-click="0">单击</button><button data-mouse-dblclick="0">双击</button><button data-wheel="-1">滚轮</button></div>
    </div>
    <div class="panel">
      <h2>虚拟键盘</h2>
      <div id="keyboard" class="keys"></div>
    </div>
  </aside>
</main>
<div id="authModal" class="modal" role="dialog" aria-modal="true">
  <form id="authForm" class="dialog">
    <h2 id="authTitle">本地账户</h2>
    <p id="authHint">请输入本地账户凭据。</p>
    <div class="field"><label for="authCurrentUsername">当前用户名</label><input id="authCurrentUsername" type="text" autocomplete="username" maxlength="32"></div>
    <div class="field"><label for="authCurrentPassword">当前密码</label><input id="authCurrentPassword" type="password" autocomplete="current-password"></div>
    <div id="authNewFields">
      <div class="field"><label for="authNewUsername">新用户名</label><input id="authNewUsername" type="text" autocomplete="username" maxlength="32"></div>
      <div class="field"><label for="authNewPassword">新密码</label><input id="authNewPassword" type="password" autocomplete="new-password" minlength="4" maxlength="64"></div>
      <div class="field"><label for="authConfirmPassword">确认新密码</label><input id="authConfirmPassword" type="password" autocomplete="new-password" minlength="4" maxlength="64"></div>
    </div>
    <div class="actions"><button id="authSubmit" class="active" type="submit">保存并继续</button></div>
    <div id="authMsg" class="msg"></div>
  </form>
</div>
<script>
const $=id=>document.getElementById(id);
const screenEl=$("screen"),screenPad=$("screenPad"),cursor=$("cursor"),video=$("video"),nosignal=$("nosignal");
const keyboardPassthrough=$("keyboardPassthrough"),keyboardPassthroughText=$("keyboardPassthroughText"),keyboardCaptureMsg=$("keyboardCaptureMsg"),directClickToggle=$("directClickToggle"),directClickText=$("directClickText");
const API={ws:null,retry:1000,token:localStorage.getItem("si_token")||"",username:localStorage.getItem("si_username")||"admin",headers(){const h={"Content-Type":"application/json"};if(this.token)h.Authorization="Bearer "+this.token;return h},setSession(t,u){this.token=t||"";this.username=u||this.username||"admin";if(this.token){localStorage.setItem("si_token",this.token);localStorage.setItem("si_auth_last_active",String(Date.now()))}else{localStorage.removeItem("si_token");localStorage.removeItem("si_auth_last_active")}if(this.username)localStorage.setItem("si_username",this.username)},async login(username,password){const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});if(!r.ok)throw new Error(await r.text());const j=await r.json();this.setSession(j.token,j.username||username);return j},async ensureToken(){if(!Session.active())return AuthUI.requireLogin();try{const r=await fetch("/api/auth/status",{headers:this.headers()});if(r.status===401)throw new Error("login required");if(!r.ok)throw new Error(await r.text());const s=await r.json();if(!s.enabled)return true;if(s.must_change_credentials)return AuthUI.requireChange(s);if(s.token_valid)return true}catch(e){}return AuthUI.requireLogin()},send(o){if(!Session.active())return;Session.touch();if(this.ws&&this.ws.readyState===1)this.ws.send(JSON.stringify(o))},async connect(){if(!(await this.ensureToken())){conn.textContent="LOGIN NEEDED";conn.className="status bad";setTimeout(()=>this.connect(),this.retry);return}const proto=location.protocol==="https:"?"wss:":"ws:";const qs=this.token?"?auth="+encodeURIComponent(this.token):"";this.ws=new WebSocket(proto+"//"+location.host+"/api/ws/hid"+qs);this.ws.onopen=()=>{conn.textContent="CONNECTED";conn.className="status ok";this.retry=1000};this.ws.onclose=()=>{conn.textContent="DISCONNECTED";conn.className="status";setTimeout(()=>this.connect(),this.retry);this.retry=Math.min(this.retry*1.5,10000)};this.ws.onerror=()=>{conn.textContent="ERROR";conn.className="status bad"}},async get(p){if(!Session.active())throw new Error("login required");const r=await fetch(p,{headers:this.headers()});if(r.status===401){if(await AuthUI.requireLogin())return this.get(p);throw new Error("login required")}if(!r.ok)throw new Error(await r.text());return r.json()},async post(p,b){if(!(await this.ensureToken()))throw new Error("login required");const r=await fetch(p,{method:"POST",headers:this.headers(),body:JSON.stringify(b||{})});if(!r.ok)throw new Error(await r.text());return r.json()}};
const AuthUI={mode:"change",pending:null,auth:null,show(mode,auth){this.mode=mode;this.auth=auth||{};authModal.classList.add("show");authNewFields.style.display=mode==="login"?"none":"block";authTitle.textContent=mode==="login"?"登录本地账户":"请修改默认账户";authHint.textContent=mode==="login"?"需要登录后才能继续。":"当前仍在使用默认 admin/admin，请保存新的本地账户。";authSubmit.textContent=mode==="login"?"登录":"保存并继续";authMsg.textContent="";authMsg.className="msg";authCurrentUsername.value=this.auth.username||this.auth.default_username||API.username||"admin";authNewUsername.value=this.auth.username||API.username||"admin";authCurrentPassword.value="";authNewPassword.value="";authConfirmPassword.value="";setTimeout(()=>authCurrentPassword.focus(),0)},hide(ok){authModal.classList.remove("show");if(this.pending){this.pending(ok);this.pending=null}},requireLogin(){this.show("login",{});return new Promise(resolve=>{this.pending=resolve})},requireChange(auth){this.show("change",auth);return new Promise(resolve=>{this.pending=resolve})}};
const Session={enabled(){return localStorage.getItem("si_auto_logout_enabled")==="1"},minutes(){return Math.max(1,Math.min(1440,Number(localStorage.getItem("si_auto_logout_minutes")||15)))},touch(){if(API.token)localStorage.setItem("si_auth_last_active",String(Date.now()))},active(){if(!this.enabled()||!API.token)return true;const last=Number(localStorage.getItem("si_auth_last_active")||Date.now());if(Date.now()-last>this.minutes()*60000){API.setSession("",API.username);try{if(API.ws)API.ws.close()}catch(e){}AuthUI.requireLogin();return false}return true},start(){["click","keydown","pointerdown","touchstart"].forEach(ev=>document.addEventListener(ev,()=>this.touch(),{passive:true,capture:true}));setInterval(()=>this.active(),10000)}};

const layout=[["Escape","F1","F2","F3","F4","F5","F6","F7","F8","F9","F10","F11","F12"],["Backquote","Digit1","Digit2","Digit3","Digit4","Digit5","Digit6","Digit7","Digit8","Digit9","Digit0","Backspace"],["Tab","KeyQ","KeyW","KeyE","KeyR","KeyT","KeyY","KeyU","KeyI","KeyO","KeyP"],["CapsLock","KeyA","KeyS","KeyD","KeyF","KeyG","KeyH","KeyJ","KeyK","KeyL","Enter"],["ShiftLeft","KeyZ","KeyX","KeyC","KeyV","KeyB","KeyN","KeyM","ArrowUp","ShiftRight"],["ControlLeft","MetaLeft","AltLeft","Space","ArrowLeft","ArrowDown","ArrowRight"]];
const labels={Escape:"Esc",Backspace:"Back",CapsLock:"Caps",ShiftLeft:"Shift",ShiftRight:"Shift",ControlLeft:"Ctrl",MetaLeft:"Win",AltLeft:"Alt",Space:"Space",ArrowLeft:"Left",ArrowRight:"Right",ArrowUp:"Up",ArrowDown:"Down"};
keyboard.innerHTML=layout.map(row=>`<div class="keyrow">${row.map(code=>`<button class="key ${code==="Space"?"wide":""}" data-code="${code}">${labels[code]||code.replace("Key","").replace("Digit","")}</button>`).join("")}</div>`).join("");
keyboard.querySelectorAll("button").forEach(b=>{b.onmousedown=e=>{e.preventDefault();b.classList.add("active");API.send({type:"keydown",code:b.dataset.code})};b.onmouseup=e=>{e.preventDefault();b.classList.remove("active");API.send({type:"keyup",code:b.dataset.code})};b.onmouseleave=()=>{b.classList.remove("active");API.send({type:"keyup",code:b.dataset.code})}});
async function status(){try{const s=await API.get("/api/status");const h=s.hid||{},v=s.video||{};renderTopBadges(s);renderResolution(v);const hidReady=!!(h.hid_ready||h.ready);hidStatus.textContent=hidReady?"HID READY":h.connected?"HID MOUNTED":h.initialized?"HID WAITING":"HID OFF";hidStatus.className="status "+(hidReady?"ok":h.enabled?"warn":"bad");videoStatus.textContent=v.connected?`${v.resolution} ${Number(v.fps||0).toFixed(1)}fps`:"VIDEO WAITING";videoStatus.className="status "+(v.connected?"ok":(modeCount(v)>0?"warn":"bad"));videoText.textContent=v.last_error||"waiting for USB UVC frame";if(v.connected)nosignal.classList.add("hide")}catch(e){conn.textContent="ERROR";conn.className="status bad"}}status();setInterval(status,2000);
</script>
</body>
