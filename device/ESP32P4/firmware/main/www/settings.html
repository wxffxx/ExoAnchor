<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExoAnchor ESP32-P4 Settings</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191b20;--panel2:#20232a;--line:#30343d;--text:#eef2f6;--muted:#96a0ad;--green:#2dd4bf;--red:#f87171;--yellow:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:flex-start;gap:22px;padding:0 22px;background:#15171b;position:sticky;top:0;z-index:2}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:32px;height:32px;border:1px solid #4b5563;border-radius:6px;display:grid;place-items:center;font-weight:800;background:#20242c;flex:0 0 auto}
.title{font-weight:700;white-space:nowrap}
.sub{font-size:12px;color:var(--muted);margin-top:-2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.nav{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.nav a{color:var(--muted);text-decoration:none;padding:7px 10px;border-radius:6px}
.nav a.active,.nav a:hover{background:var(--panel2);color:var(--text)}
.version-pill{color:var(--muted);font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:7px 0}
.status-strip{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;margin-left:auto}
.badge{font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:6px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);white-space:nowrap}
.badge.ok{color:var(--green);border-color:#1f766d}
.badge.bad{color:var(--red);border-color:#7f2d2d}
.badge.warn{color:var(--yellow);border-color:#7c5d16}
.wrap{max-width:1180px;margin:0 auto;padding:22px}
.section-title{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0;margin:20px 0 8px}
.section-title:first-child{margin-top:0}
.grid{display:grid;gap:14px}
.security-grid{grid-template-columns:1fr 1fr}
.control-grid{grid-template-columns:1fr 1fr}
.ota-grid{grid-template-columns:1fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card h2{font-size:14px;margin:0;color:#d7dce3}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head h2{margin:0}
.form-block{min-width:0;margin-top:14px}
.rows{display:grid;gap:9px}
.row{display:flex;justify-content:space-between;gap:14px;padding:9px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;min-width:0}
.row b{font-weight:600;color:#e5e9ef}
.row span:last-child{text-align:right;word-break:break-word;color:#dbe1e8}
.field{display:grid;gap:6px;margin-bottom:12px;min-width:0}
.field label,.checkline{color:var(--muted);font-size:12px}
.field input,.field select{width:100%;border:1px solid var(--line);background:#0e1014;color:var(--text);border-radius:6px;padding:11px 12px;font:15px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;min-width:0}
.field input:focus,.field select:focus{outline:2px solid rgba(45,212,191,.35);border-color:#1f766d}
.checkline{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.checkline input{width:16px;height:16px;accent-color:var(--green)}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:1px solid var(--line);background:#242832;color:var(--text);border-radius:6px;padding:10px 12px;cursor:pointer;font-weight:650}
button:hover{border-color:#59606d;background:#2a303b}
button:disabled{opacity:.48;cursor:not-allowed}
button.primary{border-color:#1f766d;background:#17302f;color:var(--green)}
button.danger{border-color:#7f2d2d;color:#fecaca}
.progress{height:8px;background:#0e1014;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:10px}
.bar{height:100%;width:0;background:var(--green);transition:width .16s ease}
.msg{min-height:20px;margin-top:10px;color:var(--muted)}
.msg.ok{color:var(--green)}
.msg.bad{color:var(--red)}
.msg.warn{color:var(--yellow)}
.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,6,8,.72);z-index:20;padding:18px}
.modal.show{display:grid}
.dialog{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.45)}
.dialog h2{font-size:16px;margin:0 0 6px}
.dialog p{margin:0 0 14px;color:var(--muted)}
@media(max-width:900px){.security-grid,.control-grid,.ota-grid{grid-template-columns:1fr}.top{height:auto;align-items:flex-start;gap:12px;padding:14px;flex-direction:column}.status-strip{justify-content:flex-start;margin-left:0}.wrap{padding:14px}.sub{max-width:260px}}
</style>
</head>
<body>
<nav class="top">
  <div class="brand"><div class="logo">EA</div><div><div class="title">ExoAnchor ESP32-P4</div><div id="deviceLabelText" class="sub">ESP32-P4</div></div></div>
  <div class="nav"><a href="/">Dashboard</a><a href="/kvm">KVM</a><a class="active" href="/settings">Settings</a><span class="version-pill">v0.84</span></div>
  <div class="status-strip" aria-label="设备概要">
    <span id="badgeVideo" class="badge">VIDEO --</span>
    <span id="badgeUsb" class="badge">USB --</span>
    <span id="badgePwr" class="badge bad">Power OFF</span>
    <span id="badgeStandby" class="badge bad">Power Standby OFF</span>
  </div>
</nav>
<main class="wrap">
  <div class="section-title">账户与安全</div>
  <section class="grid security-grid">
    <div class="card">
      <div class="card-head"><h2>本地账户</h2><span id="authBadge" class="badge">CHECKING</span></div>
      <div class="rows" id="authRows"></div>
      <form id="accountForm" class="form-block">
        <div class="field"><label for="currentPassword">当前密码</label><input id="currentPassword" type="password" autocomplete="current-password"></div>
        <div class="field"><label for="accountUsername">新用户名</label><input id="accountUsername" type="text" autocomplete="username" maxlength="32"></div>
        <div class="field"><label for="newPassword">新密码</label><input id="newPassword" type="password" autocomplete="new-password" minlength="4" maxlength="64"></div>
        <div class="field"><label for="confirmPassword">确认新密码</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="4" maxlength="64"></div>
        <div class="actions"><button class="primary" type="submit">保存账户</button></div>
        <div id="accountMsg" class="msg"></div>
      </form>
    </div>
    <div class="card">
      <h2>会话</h2>
      <label class="checkline"><input id="autoLogoutEnabled" type="checkbox"> 自动 Logout</label>
      <div class="field"><label for="autoLogoutMinutes">空闲时间（分钟）</label><input id="autoLogoutMinutes" type="number" min="1" max="1440" step="1" inputmode="numeric"></div>
      <div class="actions"><button id="saveAutoLogout" class="primary" type="button">保存会话</button></div>
      <div id="sessionMsg" class="msg"></div>
    </div>
  </section>

  <div class="section-title">设备与视频</div>
  <section class="grid control-grid">
    <div class="card">
      <h2>设备身份</h2>
      <form id="deviceForm" style="margin-top:12px">
        <div class="field"><label for="deviceLabel">设备标注名</label><input id="deviceLabel" type="text" maxlength="48" autocomplete="off" placeholder="ESP32-P4"></div>
        <div class="actions"><button class="primary" type="submit">保存标注名</button></div>
      </form>
      <div id="deviceMsg" class="msg"></div>
    </div>
    <div class="card">
      <h2>KVM 视频</h2>
      <form id="videoForm" style="margin-top:12px">
        <div class="field"><label for="resolutionSelect">默认分辨率</label><select id="resolutionSelect"></select></div>
        <div class="actions"><button id="applyResolution" class="primary" type="submit">保存视频默认值</button></div>
      </form>
      <div id="videoMsg" class="msg"></div>
    </div>
  </section>

  <div class="section-title">固件更新</div>
  <section class="grid ota-grid">
    <div class="card">
      <div class="card-head"><h2>远程更新</h2><span id="otaBadge" class="badge">OTA --</span></div>
      <div class="rows" id="otaRows"></div>
      <form id="otaSettingsForm" style="margin-top:14px">
        <div class="field"><label for="otaManifestUrl">Manifest URL</label><input id="otaManifestUrl" type="url" autocomplete="off"></div>
        <div class="field"><label for="otaChannel">Channel</label><input id="otaChannel" type="text" autocomplete="off" maxlength="16" placeholder="stable"></div>
        <label class="checkline"><input id="otaAutoCheck" type="checkbox" disabled> 自动定时检查（保留）</label>
        <div class="actions"><button class="primary" type="submit">保存更新设置</button><button id="otaCheck" type="button">检查更新</button><button id="otaInstall" type="button">安装更新</button><button id="otaReboot" class="danger" type="button">重启应用</button></div>
      </form>
      <div id="otaMsg" class="msg"></div>
    </div>
    <form id="otaUploadForm" class="card">
      <h2>本地上传</h2>
      <div class="field" style="margin-top:12px"><label for="otaFile">固件 bin</label><input id="otaFile" type="file" accept=".bin,application/octet-stream"></div>
      <div class="actions"><button class="primary" type="submit">上传固件</button></div>
      <div class="progress"><div id="otaProgress" class="bar"></div></div>
    </form>
  </section>

  <div class="section-title">运行摘要</div>
  <section class="card">
    <div class="rows" id="deviceRows"></div>
  </section>
</main>

<div id="authModal" class="modal" role="dialog" aria-modal="true">
  <form id="authForm" class="dialog">
    <h2 id="authTitle">本地账户</h2>
    <p id="authHint">请输入本地账户凭据。</p>
    <div class="field"><label for="authCurrentUsername">当前用户名</label><input id="authCurrentUsername" type="text" autocomplete="username" maxlength="32"></div>
    <div class="field"><label for="authCurrentPassword">当前密码</label><input id="authCurrentPassword" type="password" autocomplete="current-password"></div>
    <div id="authNewFields">
      <div class="field"><label for="authNewUsername">新用户名</label><input id="authNewUsername" type="text" autocomplete="username" maxlength="32"></div>
      <div class="field"><label for="authNewPassword">新密码</label><input id="authNewPassword" type="password" autocomplete="new-password" minlength="4" maxlength="64"></div>
      <div class="field"><label for="authConfirmPassword">确认新密码</label><input id="authConfirmPassword" type="password" autocomplete="new-password" minlength="4" maxlength="64"></div>
    </div>
    <div class="actions"><button id="authSubmit" class="primary" type="submit">保存并继续</button></div>
    <div id="authMsg" class="msg"></div>
  </form>
</div>
<script>
let authState={username:localStorage.getItem("si_username")||"admin"};
const API={token:localStorage.getItem("si_token")||"",username:localStorage.getItem("si_username")||"admin",headers(){const h={"Content-Type":"application/json"};if(this.token)h.Authorization="Bearer "+this.token;return h},authHeader(){return this.token?{"Authorization":"Bearer "+this.token}:{}},async get(p){if(!Session.active())throw new Error("login required");const r=await fetch(p,{headers:this.headers()});if(r.status===401){if(await AuthUI.requireLogin())return this.get(p);throw new Error("login required")}if(!r.ok)throw new Error(await r.text());return r.json()},async post(p,b){if(p!=="/api/auth/login"&&!Session.active())throw new Error("login required");const r=await fetch(p,{method:"POST",headers:this.headers(),body:JSON.stringify(b||{})});if(r.status===401&&p!=="/api/auth/login"){if(await AuthUI.requireLogin())return this.post(p,b);throw new Error("login required")}if(!r.ok)throw new Error(await r.text());return r.json()},upload(p,file,onProgress){if(!Session.active())return Promise.reject(new Error("login required"));return new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open("POST",p);if(this.token)x.setRequestHeader("Authorization","Bearer "+this.token);x.setRequestHeader("Content-Type","application/octet-stream");x.upload.onprogress=e=>{if(e.lengthComputable&&onProgress)onProgress(e.loaded/e.total)};x.onload=()=>{if(x.status>=200&&x.status<300){try{resolve(JSON.parse(x.responseText||"{}"))}catch{resolve({ok:true})}}else reject(new Error(x.responseText||x.statusText||"upload failed"))};x.onerror=()=>reject(new Error("upload failed"));x.send(file)})},setSession(t,u){this.token=t||"";this.username=u||this.username||"admin";if(this.token){localStorage.setItem("si_token",this.token);localStorage.setItem("si_auth_last_active",String(Date.now()))}else{localStorage.removeItem("si_token");localStorage.removeItem("si_auth_last_active")}if(this.username)localStorage.setItem("si_username",this.username)}};
const AuthUI={mode:"change",pending:null,auth:null,show(mode,auth){this.mode=mode;this.auth=auth||{};authModal.classList.add("show");authNewFields.style.display=mode==="login"?"none":"block";authTitle.textContent=mode==="login"?"登录本地账户":"请修改默认账户";authHint.textContent=mode==="login"?"需要登录后才能继续。":"当前仍在使用默认 admin/admin，请保存新的本地账户。";authSubmit.textContent=mode==="login"?"登录":"保存并继续";authMsg.textContent="";authMsg.className="msg";authCurrentUsername.value=this.auth.username||this.auth.default_username||API.username||"admin";authNewUsername.value=this.auth.username||API.username||"admin";authCurrentPassword.value="";authNewPassword.value="";authConfirmPassword.value="";setTimeout(()=>authCurrentPassword.focus(),0)},hide(ok){authModal.classList.remove("show");if(this.pending){this.pending(ok);this.pending=null}},requireLogin(){this.show("login",{});return new Promise(resolve=>{this.pending=resolve})},requireChange(auth){this.show("change",auth);return new Promise(resolve=>{this.pending=resolve})},async checkRequired(){try{const r=await fetch("/api/auth/status",{headers:API.headers()});if(!r.ok){await this.requireLogin();return false}const a=await r.json();if(a.enabled&&!a.token_valid){await this.requireLogin();return false}if(a.must_change_credentials){await this.requireChange(a);return false}return true}catch(e){await this.requireLogin();return false}}};
const Session={enabled(){return localStorage.getItem("si_auto_logout_enabled")==="1"},minutes(){return Math.max(1,Math.min(1440,Number(localStorage.getItem("si_auto_logout_minutes")||15)))},touch(){if(API.token)localStorage.setItem("si_auth_last_active",String(Date.now()))},active(){if(!this.enabled()||!API.token)return true;const last=Number(localStorage.getItem("si_auth_last_active")||Date.now());if(Date.now()-last>this.minutes()*60000){API.setSession("",API.username);msg(sessionMsg,"自动 Logout","warn");return false}return true},loadForm(){autoLogoutEnabled.checked=this.enabled();autoLogoutMinutes.value=String(this.minutes())},save(){localStorage.setItem("si_auto_logout_enabled",autoLogoutEnabled.checked?"1":"0");localStorage.setItem("si_auto_logout_minutes",String(this.minutesFromInput()));this.touch();this.loadForm();msg(sessionMsg,autoLogoutEnabled.checked?`自动 Logout：${this.minutes()} 分钟`:"自动 Logout 已关闭","ok")},minutesFromInput(){return Math.max(1,Math.min(1440,Number(autoLogoutMinutes.value||15)))},start(){this.loadForm();["click","keydown","pointerdown","touchstart"].forEach(ev=>document.addEventListener(ev,()=>this.touch(),{passive:true,capture:true}));setInterval(()=>this.active(),10000)}};
authForm.onsubmit=async e=>{e.preventDefault();authMsg.textContent="";authMsg.className="msg";const currentUsername=authCurrentUsername.value.trim(),currentPassword=authCurrentPassword.value;if(AuthUI.mode==="login"){try{const r=await API.post("/api/auth/login",{username:currentUsername,password:currentPassword});API.setSession(r.token,r.username||currentUsername);if(r.must_change_credentials){AuthUI.show("change",r);return}AuthUI.hide(true);await refresh()}catch(err){authMsg.textContent=err.message||"登录失败";authMsg.className="msg bad"}return}const username=authNewUsername.value.trim(),next=authNewPassword.value,confirm=authConfirmPassword.value;if(!username){authMsg.textContent="用户名不能为空";authMsg.className="msg bad";return}if(next!==confirm){authMsg.textContent="两次密码不一致";authMsg.className="msg bad";return}try{if(!API.token){const login=await API.post("/api/auth/login",{username:currentUsername,password:currentPassword});API.setSession(login.token,login.username||currentUsername)}const r=await API.post("/api/settings/account",{current_username:currentUsername,current_password:currentPassword,username,new_password:next});API.setSession(r.token,r.username||username);AuthUI.hide(true);await refresh()}catch(err){authMsg.textContent=err.message||"保存失败";authMsg.className="msg bad"}};
function row(name,value){return `<div class="row"><b>${name}</b><span>${value}</span></div>`}
function msg(el,text,kind){el.textContent=text||"";el.className="msg "+(text?(kind||"ok"):"")}
function fillUsernames(name){if(name&&document.activeElement!==accountUsername)accountUsername.value=name}
const DEFAULT_DEVICE_LABEL="ESP32-P4";
function deviceLabelValue(info){const label=String(info?.device_label||info?.label||localStorage.getItem("si_device_label")||DEFAULT_DEVICE_LABEL).trim();return label||DEFAULT_DEVICE_LABEL}
function applyDeviceLabel(label){const value=String(label||DEFAULT_DEVICE_LABEL).trim()||DEFAULT_DEVICE_LABEL;localStorage.setItem("si_device_label",value);deviceLabelText.textContent=value;if(document.activeElement!==deviceLabel)deviceLabel.value=value}
function setBadge(el,label,state,kind){el.textContent=`${label} ${state}`;el.className=`badge ${kind||""}`.trim()}
function modeCount(video){return Array.isArray(video.modes)?video.modes.length:Number(video.modes_count??video.mode_count??video.modes??0)}
function renderTopBadges(status){const video=status.video||{},hid=status.hid||{};if(video.connected)setBadge(badgeVideo,"VIDEO","ONLINE","ok");else if(modeCount(video)>0)setBadge(badgeVideo,"VIDEO","STANDBY","warn");else setBadge(badgeVideo,"VIDEO","OFFLINE","bad");if(hid.hid_ready||hid.ready)setBadge(badgeUsb,"USB","ONLINE","ok");else if(hid.connected||hid.mounted||hid.initialized||hid.enabled)setBadge(badgeUsb,"USB","STANDBY","warn");else setBadge(badgeUsb,"USB","OFFLINE","bad");setBadge(badgePwr,"Power","OFF","bad");setBadge(badgeStandby,"Power Standby","OFF","bad")}
function modeFpsX100(m){return Number(m.fps_x100||Math.round(Number(m.fps||0)*100))}
function modeFormat(m){return String(m.pixel_format||"MJPEG").toUpperCase()}
function modeValue(m){return `${modeFormat(m)}:${m.width}x${m.height}@${modeFpsX100(m)}`}
function modeLabel(m){const fps=modeFpsX100(m)/100;return `${modeFormat(m)} ${m.width}x${m.height} @ ${fps%1?fps.toFixed(1):fps.toFixed(0)}fps`}
const COMMON_VIDEO_MODES=[["MJPEG",1920,1080,50],["MJPEG",1920,1080,30],["MJPEG",1920,1080,25],["MJPEG",1280,720,60],["MJPEG",1280,720,50],["MJPEG",1280,720,30],["MJPEG",640,480,30]];
function commonModes(modes){const list=Array.isArray(modes)?modes:[];return COMMON_VIDEO_MODES.map(([fmt,w,h,fps])=>list.find(m=>modeFormat(m)===fmt&&m.width===w&&m.height===h&&modeFpsX100(m)===fps*100)).filter(Boolean)}
function renderVideoControls(video){
  const modes=commonModes(video.modes);
  const kvm=video.control?.kvm_mode||{};
  const current=resolutionSelect.value;
  resolutionSelect.disabled=modes.length===0;
  applyResolution.disabled=modes.length===0;
  resolutionSelect.innerHTML=modes.length?modes.map(m=>`<option value="${modeValue(m)}">${modeLabel(m)}</option>`).join(""):`<option value="">无常用模式</option>`;
  if(modes.length){
    const selected=modes.find(m=>m.width===kvm.width&&m.height===kvm.height&&modeFpsX100(m)===(kvm.fps_x100||0))||modes.find(m=>m.selected)||modes.find(m=>m.width===video.width&&m.height===video.height)||modes[0];
    resolutionSelect.value=(document.activeElement===resolutionSelect&&current)?current:modeValue(selected);
  }
}
function renderOta(ota){
  const settings=ota?.settings||{},last=ota?.last_check||{},part=ota?.partition||{};
  if(document.activeElement!==otaManifestUrl)otaManifestUrl.value=settings.manifest_url||settings.default_manifest_url||"";
  if(document.activeElement!==otaChannel)otaChannel.value=settings.channel||"stable";
  otaAutoCheck.checked=!!settings.auto_check;
  otaAutoCheck.disabled=true;
  const busy=!!ota?.busy;
  const checked=!!last.checked;
  otaBadge.textContent=busy?"OTA BUSY":checked&&last.update_available?"OTA UPDATE":"OTA READY";
  otaBadge.className="badge "+(busy||last.update_available?"warn":"ok");
  otaInstall.disabled=busy||!last.update_available;
  otaCheck.disabled=busy;
  otaReboot.disabled=busy;
  const latest=checked?(last.version||"--"):"未检查";
  const result=checked?(last.message||"--"):"not checked";
  const size=last.size?`${(last.size/1024/1024).toFixed(2)} MB`:"--";
  otaRows.innerHTML=row("当前版本",ota?.current_version||"--")+row("启动分区",`${part.running||"--"} / ${part.boot||"--"}`)+row("最新版本",latest)+row("更新结果",result)+row("固件大小",size);
}
function netPhy(net,eth){return net.phy||eth.phy||"IP101GRI"}
function netSpeed(net,eth){const mbps=Number(net.speed_mbps||eth.speed_mbps||0);return mbps>0?`${mbps}M`:"--M"}
function netDuplex(net,eth){if(net.full_duplex===true||eth.full_duplex===true)return"full duplex";if(net.full_duplex===false||eth.full_duplex===false)return"half duplex";return"--"}
function netWorkState(net,eth){return net.link_up?`${netDuplex(net,eth)} ${netSpeed(net,eth)}`:"link down"}
async function refresh(){
  try{
    const [auth,status,info,ota]=await Promise.all([API.get("/api/auth/status"),API.get("/api/status"),API.get("/api/system/info"),API.get("/api/ota/status")]);
    renderTopBadges(status);
    renderOta(ota);
    const currentLabel=deviceLabelValue(info);
    applyDeviceLabel(currentLabel);
    authState=auth;API.username=auth.username||API.username||"admin";
    const valid=!auth.enabled||auth.token_valid;
    const must=!!auth.must_change_credentials;
    authBadge.textContent=must&&valid?"需修改":valid?"AUTH OK":"LOGIN NEEDED";
    authBadge.className="badge "+(must&&valid?"warn":valid?"ok":"bad");
    authRows.innerHTML=row("用户名",auth.username||"--")+row("凭据",must?"默认，需修改":auth.local_credentials?"已设置":"默认")+row("会话",valid?"valid":"missing");
    fillUsernames(auth.username||auth.default_username||API.username);
    if(must&&valid&&!accountMsg.textContent)msg(accountMsg,"请保存新的账户凭据","warn");
    if(must&&!authModal.classList.contains("show"))AuthUI.show("change",auth);
    const net=status.network||{},video=status.video||{},hid=status.hid||{},pins=hid.pins||{},eth=info.network?.ethernet||{};
    const hidReady=!!(hid.hid_ready||hid.ready);
    const hidPort=hid.port||((pins.dm_gpio!=null&&pins.dp_gpio!=null)?`GPIO${pins.dm_gpio}/${pins.dp_gpio}`:"GPIO26/27");
    const vctl=video.control||{};
    const owner=video.capture_owner||vctl.active_owner||"off";
    const ownerText=owner==="preview"?"预览":owner==="kvm"?"KVM":"关闭";
    renderVideoControls(video);
    deviceRows.innerHTML=row("标注名",currentLabel)+row("IP",net.ip||eth.ipv4||"No IP")+row("Ethernet",`${netPhy(net,eth)} · ${netWorkState(net,eth)}`)+row("Video",video.connected?video.resolution:(modeCount(video)>0?"standby":video.last_error||"offline"))+row("Capture",video.capture_enabled?ownerText:"off")+row("HID USB",hidReady?"ready":hid.connected?"mounted":hid.initialized?"waiting":"off")+row("HID port",hidPort);
  }catch(e){
    authBadge.textContent="LOGIN NEEDED";authBadge.className="badge bad";msg(sessionMsg,e.message,"bad");if(!authModal.classList.contains("show"))AuthUI.requireLogin();
  }
}
accountForm.onsubmit=async e=>{
  e.preventDefault();msg(accountMsg,"","");
  const username=accountUsername.value.trim(),next=newPassword.value,confirm=confirmPassword.value;
  if(!username){msg(accountMsg,"用户名不能为空","bad");return}
  if(next!==confirm){msg(accountMsg,"两次密码不一致","bad");return}
  try{
    const r=await API.post("/api/settings/account",{current_username:authState.username||API.username,current_password:currentPassword.value,username,new_password:next});
    API.setSession(r.token,r.username||username);currentPassword.value="";newPassword.value="";confirmPassword.value="";fillUsernames(r.username||username);
    msg(accountMsg,"账户已保存","ok");await refresh();
  }catch(err){msg(accountMsg,err.message,"bad")}
};
deviceForm.onsubmit=async e=>{
  e.preventDefault();msg(deviceMsg,"","");
  const label=deviceLabel.value.trim()||DEFAULT_DEVICE_LABEL;
  try{
    const r=await API.post("/api/settings/device",{label});
    const saved=r.label||label;
    applyDeviceLabel(saved);
    msg(deviceMsg,"标注名已保存","ok");
    await refresh();
  }catch(err){msg(deviceMsg,err.message,"bad")}
};
videoForm.onsubmit=async e=>{
  e.preventDefault();msg(videoMsg,"","");
  const m=/^([A-Z0-9]+):(\d+)x(\d+)@(\d+)$/.exec(resolutionSelect.value||"");
  if(!m){msg(videoMsg,"没有可用视频模式","bad");return}
  const pixel_format=m[1],w=Number(m[2]),h=Number(m[3]),fps_x100=Number(m[4]);
  try{
    await API.post("/api/video/resolution",{pixel_format,width:w,height:h,fps_x100});
    msg(videoMsg,`KVM 模式已保存：${w}x${h} @ ${(fps_x100/100).toFixed(fps_x100%100?2:0)}fps`,"ok");
    await refresh();
  }catch(err){msg(videoMsg,err.message,"bad")}
};
otaSettingsForm.onsubmit=async e=>{
  e.preventDefault();msg(otaMsg,"","");
  try{
    await API.post("/api/ota/settings",{manifest_url:otaManifestUrl.value.trim(),channel:(otaChannel.value.trim()||"stable"),auto_check:false});
    msg(otaMsg,"更新设置已保存","ok");
    await refresh();
  }catch(err){msg(otaMsg,err.message,"bad")}
};
otaCheck.onclick=async()=>{
  msg(otaMsg,"正在检查更新","warn");
  try{
    const r=await API.post("/api/ota/check",{});
    const last=r.last_check||{};
    msg(otaMsg,last.update_available?`发现版本 ${last.version}`:(last.message||"已经是最新版本"),last.update_available?"warn":"ok");
    await refresh();
  }catch(err){msg(otaMsg,err.message,"bad");await refresh()}
};
otaInstall.onclick=async()=>{
  msg(otaMsg,"正在安装更新，画面会暂停","warn");
  try{
    const r=await API.post("/api/ota/install",{});
    msg(otaMsg,`已写入 ${((r.size||0)/1024/1024).toFixed(2)} MB，请重启应用`,"ok");
    await refresh();
  }catch(err){msg(otaMsg,err.message,"bad");await refresh()}
};
otaUploadForm.onsubmit=async e=>{
  e.preventDefault();msg(otaMsg,"","");
  const file=otaFile.files&&otaFile.files[0];
  if(!file){msg(otaMsg,"请选择固件 bin","bad");return}
  otaProgress.style.width="0%";
  msg(otaMsg,"正在上传固件，画面会暂停","warn");
  try{
    const r=await API.upload("/api/ota/upload",file,p=>{otaProgress.style.width=`${Math.round(p*100)}%`});
    otaProgress.style.width="100%";
    msg(otaMsg,`已写入 ${((r.size||file.size)/1024/1024).toFixed(2)} MB，请重启应用`,"ok");
    otaFile.value="";
    await refresh();
  }catch(err){msg(otaMsg,err.message,"bad");await refresh()}
};
otaReboot.onclick=async()=>{
  msg(otaMsg,"正在重启","warn");
  try{await API.post("/api/ota/reboot",{});msg(otaMsg,"重启指令已发送","ok")}catch(err){msg(otaMsg,err.message,"bad")}
};
saveAutoLogout.onclick=()=>Session.save();
autoLogoutMinutes.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();Session.save()}};
async function boot(){fillUsernames(API.username);Session.start();if(await AuthUI.checkRequired())await refresh();setInterval(()=>{if(!authModal.classList.contains("show"))refresh()},3000);setInterval(()=>{if(!authModal.classList.contains("show"))AuthUI.checkRequired()},5000)}
boot();
</script>
</body>
</html>
