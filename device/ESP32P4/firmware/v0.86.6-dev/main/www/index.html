w-head-metric strong{color:inherit;white-space:nowrap}.preview-head-metric strong{font-weight:800}.preview-card-actions button{padding:8px 11px}.preview{border-radius:9px}.metric,.row{border-radius:8px}.details{margin-top:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden}.details>summary{cursor:pointer;padding:15px 17px;font-weight:750;list-style:none}.details>summary:after{content:"＋";float:right;color:var(--muted)}.details[open]>summary:after{content:"－"}.details-body{padding:0 14px 14px}.details .equal-grid{margin-top:0}.log{height:260px;border-radius:8px}

<body>
<div id="appShell"></div><script>ExoAnchorShell.mount("overview")</script>
<main class="wrap">
  <section class="dashboard-grid">
    <div class="hero">
      <div class="hero-kicker">System DashBoard</div>
      <h1>欢迎回来</h1>
      <div class="identity-strip">
        <div class="identity-item"><div class="label">运行时间</div><div id="uptimeValue" class="value">--</div></div>
        <div class="identity-item"><div class="label">IP 地址</div><div id="ipValue" class="value">--</div><div id="ipMeta" class="small">--</div></div>
        <div class="identity-item"><div class="label">累计登录次数</div><div id="loginCountValue" class="value">--</div><div class="small">成功认证计数</div></div>
        <div class="identity-item identity-controls">
          <div class="identity-action"><button id="powerBtn" class="power-circle" type="button" aria-label="电源">PWR</button></div>
          <div class="identity-action"><button id="resetBtn" class="reset-circle" type="button" aria-label="主机复位">RST</button></div>
          <div class="identity-action"><button id="holdPowerBtn" class="hold-power-circle" type="button" aria-label="长按电源"><span>HOLD</span><span>PWR</span></button></div>
        </div>
        <div class="identity-item identity-locator">
          <div class="label">Locator LED</div>
          <label class="ui-switch"><input id="locatorToggle" type="checkbox" role="switch" aria-label="Turn on Locator LED"><span class="ui-switch-track"><span class="ui-switch-thumb"></span></span></label>
        </div>
      </div>
      <div class="performance-rings">
        <div class="ring-metric"><div id="ringCpu" class="ring"><div id="perfCpu" class="value">--</div></div><div class="ring-copy"><b>CPU</b><div id="perfCpuMeta" class="small">--</div></div></div>
        <div class="ring-metric"><div id="ringSram" class="ring info"><div id="perfSram" class="value">--</div></div><div class="ring-copy"><b>SRAM</b><div id="perfSramMeta" class="small">--</div></div></div>
        <div class="ring-metric"><div id="ringPsram" class="ring info"><div id="perfPsram" class="value">--</div></div><div class="ring-copy"><b>PSRAM</b><div id="perfPsramMeta" class="small">--</div></div></div>
        <div class="ring-metric"><div id="ringFlash" class="ring"><div id="perfFlash" class="value">--</div></div><div class="ring-copy"><b>Flash</b><div id="perfFlashMeta" class="small">--</div></div></div>
        <div class="ring-metric"><div id="ringTf" class="ring"><div id="perfTf" class="value">--</div></div><div class="ring-copy"><b>TF Card</b><div id="perfTfMeta" class="small">--</div></div></div>
        <div id="extraStorageMetrics" class="storage-metrics"></div>
      </div>
    </div>
    <aside id="agentTask" class="agent-task" hidden>
      <div class="agent-task-head"><h2>Agent</h2></div>
      <div class="agent-task-body">
        <b id="agentTaskTitle">当前任务</b>
        <p id="agentTaskDetail"></p>
        <div class="agent-task-meta">
          <div><span>目标</span><strong id="agentTaskGoal">--</strong></div>
          <div><span>当前步骤</span><strong id="agentTaskStep">--</strong></div>
          <div id="agentTaskRequestRow" hidden><span>等待确认</span><strong id="agentTaskRequest">--</strong></div>
        </div>
      </div>
      <div class="quick-links"><a href="/agent">打开 Workspace <span>→</span></a></div>
    </aside>
    <div class="card preview-card">
      <div class="preview-card-head">

          </div>

        </div>
      </div>
      <img id="preview" class="preview" alt="">
    </div>
  </section>
</main>
<script>
const UI=window.ExoAnchorUI,API=UI.api,Session=UI.session,AuthUI=UI.auth;
const EMBEDDED_AGENT=UI.features.embeddedAgent;
AuthUI.bindForm(async()=>{const [status,info]=await Promise.all([UI.status.refresh(),UI.info.refresh(),Session.load()]);await update(status,info)});
const dashboardGrid=document.querySelector(".dashboard-grid");
dashboardGrid.classList.toggle("agent-idle",!EMBEDDED_AGENT);
function fmtBytes(n){const v=Number(n);if(!Number.isFinite(v)||v<0)return"--";if(v===0)return"0 B";if(v>=1073741824)return `${(v/1073741824).toFixed(v>=10737418240?1:2)} GB`;if(v>=1048576)return Math.round(v/1048576)+" MB";if(v>=1024)return Math.round(v/1024)+" KB";return Math.round(v)+" B"}
function fmtMbps(n){return n>0?`${Number(n).toFixed(n>=10?1:2)} Mbps`:"--"}
function fmtPercent(n){return `${Number(n||0).toFixed(1)}%`}
function fmtMs(n){return n>0?`${Math.round(Number(n))} ms`:"--"}
function fmtUsageBytes(region){const total=Number(region?.total_bytes||0);if(!(total>0))return"未检测到";const reported=Number(region?.used_bytes),used=Number.isFinite(reported)?reported:Math.max(0,total-Number(region?.free_bytes||0));return `${fmtBytes(used)} / ${fmtBytes(total)} 已用`}
function netSpeed(net,eth){const mbps=Number(net.speed_mbps||eth.speed_mbps||0);return mbps>0?`${mbps}M`:""}
function netDuplex(net,eth){if(net.full_duplex===true||eth.full_duplex===true)return"full duplex";if(net.full_duplex===false||eth.full_duplex===false)return"half duplex";return""}
function setRing(el,value,available=true){const n=Math.max(0,Math.min(100,Number(value)||0));el.style.setProperty("--value",available?n:0);el.dataset.value=available?`${Math.round(n)}%`:"N/A";el.classList.toggle("unknown",!available);el.classList.toggle("warn",available&&n>=85&&n<95);el.classList.toggle("bad",available&&n>=95)}
const extraStorageNodes=new Map();
function ensureExtraStorageNode(device){const id=String(device.id||"");let node=extraStorageNodes.get(id);if(node)return node;const metric=document.createElement("div"),ring=document.createElement("div"),copy=document.createElement("div"),label=document.createElement("b"),meta=document.createElement("div");metric.className="ring-metric";ring.className="ring";copy.className="ring-copy";meta.className="small";copy.append(label,meta);metric.append(ring,copy);node={metric,ring,label,meta};extraStorageNodes.set(id,node);return node}
function renderExtraStorageDevices(devices){const current=new Set();for(const device of Array.isArray(devices)?devices:[]){const id=String(device?.id||"");if(!id||id==="internal_flash"||id==="tf_card")continue;current.add(id);const node=ensureExtraStorageNode(device),available=device.supported!==false&&(!!device.detected||!!device.mounted||Number(device.total_bytes)>0);node.label.textContent=device.label||id;node.meta.textContent=available?fmtUsageBytes(device):(device.last_error||"未检测到");node.metric.title=[device.bus,device.role].filter(Boolean).join(" · ");setRing(node.ring,device.usage_percent,available);extraStorageMetrics.append(node.metric)}for(const [id,node] of extraStorageNodes){if(current.has(id))continue;node.metric.remove();extraStorageNodes.delete(id)}}
let previewEnabled=false,previewTimer=0,previewPending=null,previewRequestBusy=false,previewFps=1,previewIntervalMs=1000;
let updateBusy=false;
function authUrl(path){return path}
function refreshSnapshot(){if(previewEnabled)preview.src=authUrl("/api/snapshot?t="+Date.now())}
function setPreviewLoop(on){if(on){if(!previewTimer){refreshSnapshot();previewTimer=UI.lifecycle.interval(refreshSnapshot,previewIntervalMs)}}else{if(previewTimer){UI.lifecycle.clearTimer(previewTimer);previewTimer=0}preview.removeAttribute("src")}}
function setPreviewRate(mode){if(!mode)return;const nextFps=Math.max(1,Math.min(10,Number(mode.fps_x100||100)/100)),nextInterval=Math.max(100,Number(mode.stride_ms)||Math.round(1000/nextFps));if(nextFps===previewFps&&nextInterval===previewIntervalMs)return;previewFps=nextFps;previewIntervalMs=nextInterval;if(previewTimer){UI.lifecycle.clearTimer(previewTimer);previewTimer=0;if(previewEnabled)setPreviewLoop(true)}}
function renderPreviewControl(serverEnabled,mode){setPreviewRate(mode);const on=previewPending===null?!!serverEnabled:previewPending;previewEnabled=on;previewToggle.checked=on;previewToggle.setAttribute("aria-busy",previewRequestBusy?"true":"false");previewToggle.closest(".ui-switch")?.classList.toggle("preview-busy",previewRequestBusy);previewToggleText.textContent=previewRequestBusy?(on?"开启中":"关闭中"):(on?"预览开启":"预览关闭");refreshShot.disabled=!on||previewRequestBusy;setPreviewLoop(on)}
async function setPreviewEnabled(on){if(previewRequestBusy){renderPreviewControl(previewEnabled);return}const before=previewEnabled;previewPending=!!on;previewRequestBusy=true;renderPreviewControl(before);try{const result=await API.post("/api/video/lease",{owner:"preview",enabled:!!on});const confirmed=result?.control?.preview_enabled??!!on;previewPending=null;previewRequestBusy=false;renderPreviewControl(confirmed);if(confirmed)refreshSnapshot()}catch(err){previewPending=null;previewRequestBusy=false;renderPreviewControl(before);previewToggle.title=err.message||"预览切换失败"}}
let forceOffMs=5000,locatorRequestBusy=false,locatorPending=null,lastLocator={supported:false,gpio:-1,active:false};
function renderLocator(power){if(power.locator)lastLocator={...lastLocator,...power.locator};const locator=lastLocator,supported=!!locator.supported,on=locatorPending===null?!!locator.active:locatorPending;locatorToggle.checked=on;locatorToggle.disabled=!supported||!power.available||!!power.busy||locatorRequestBusy;locatorToggle.setAttribute("aria-busy",locatorRequestBusy?"true":"false");locatorToggle.setAttribute("aria-label",locatorRequestBusy?"Locator LED busy":on?"Turn off Locator LED":"Turn on Locator LED");locatorToggle.title=supported?(on?"Turn off Locator LED":"Turn on Locator LED"):"Locator LED is not configured"}
function renderPower(power){const available=!!power.available&&!power.busy;const state=power.busy?"执行中":power.available?(power.last_action&&power.last_action!=="idle"?power.last_action:"电源控制"):power.last_error||"不可用";forceOffMs=Math.max(1000,Number(power.force_off_ms||5000));powerBtn.disabled=!(available&&power.buttons?.power?.available);resetBtn.disabled=!(available&&power.buttons?.reset?.available);holdPowerBtn.disabled=!(available&&power.buttons?.power?.available);powerBtn.title=`电源 · ${state}`;resetBtn.title=`主机复位 · ${state}`;holdPowerBtn.title=`长按电源 ${(forceOffMs/1000).toFixed(forceOffMs%1000?1:0)} 秒 · ${state}`;renderLocator(power)}
function agentStateLabel(state){return({running:"正在执行",waiting_request:"等待确认",paused:"已暂停",failed:"任务失败",done:"最近完成",aborted:"已停止"})[state]||"当前任务"}
function renderAgentSummary(run,queue){
  const state=String(run?.state||"idle"),request=queue?.current||run?.request||null;
  const active=["running","waiting_request","paused"].includes(state);
  const recent=["done","failed","aborted"].includes(state)&&Number(run?.finished_ms||0)>0;
  const waiting=request&&request.status==="waiting_user";
  const visible=active||recent||waiting;
  agentTask.hidden=!visible;
  dashboardGrid.classList.toggle("agent-idle",!visible);
  if(!visible)return;
  agentTaskTitle.textContent=agentStateLabel(waiting?"waiting_request":state);
  agentTaskDetail.textContent=String(run?.detail||request?.reason||"可在 Workspace 或悬浮助手中继续处理。");
  agentTaskGoal.textContent=String(run?.goal||run?.turn?.goal||"未提供目标");
  const steps=Array.isArray(run?.plan?.steps)?run.plan.steps:[];
  const current=steps.find(step=>["running","waiting_request","blocked"].includes(step?.state))||steps[0];
  agentTaskStep.textContent=String(current?.title||run?.stage||"等待任务进展");
  agentTaskRequestRow.hidden=!waiting;
  agentTaskRequest.textContent=waiting?String(request.reason||request.resource||"Agent 请求一次性授权"):"";
}
async function refreshAgentSummary(){
  if(!EMBEDDED_AGENT)return;
  try{
    const [run,queue]=await Promise.all([API.getShared("/api/agent/run/status",{timeoutMs:5000}),API.getShared("/api/agent/requests",{timeoutMs:5000})]);
    renderAgentSummary(run,queue);
  }catch(error){
    if(error?.status!==401)console.warn("Agent summary unavailable",error);
    renderAgentSummary(null,null);
  }
}
function powerActionButton(action){return action==="power"?powerBtn:action==="reset"?resetBtn:holdPowerBtn}
async function powerAction(action){const button=powerActionButton(action);button.title="发送中";try{const r=await API.post("/api/power/action",{action});renderPower(r);await update()}catch(err){button.title=err.message||"动作失败"}}
async function setLocatorEnabled(on){if(locatorRequestBusy)return;const before=!on;locatorPending=!!on;locatorRequestBusy=true;renderLocator({available:true});try{const r=await API.post("/api/power/action",{action:on?"locator_on":"locator_off"});locatorPending=null;locatorRequestBusy=false;renderPower(r);await UI.status.refresh()}catch(err){locatorPending=null;locatorRequestBusy=false;lastLocator.active=before;renderLocator({available:true});locatorToggle.title=err.message||"Locator LED request failed"}}
async function holdPowerAction(){const seconds=(forceOffMs/1000).toFixed(forceOffMs%1000?1:0);if(!(await UI.confirmAction({title:"长按电源键？",message:`将模拟长按电源键 ${seconds} 秒，通常会强制关闭被控端，未保存的数据可能丢失。`,confirmLabel:"HOLD PWR"})))return;await powerAction("force_off")}
async function update(statusValue,infoValue){
  if(updateBusy)return;
  updateBusy=true;
  try{
    const [status,info]=await Promise.all([
      statusValue||UI.status.value||UI.status.refresh(),
      infoValue||UI.info.value||UI.info.refresh()
    ]);
    const video=status.video||{},power=status.power||{};
    const vctl=video.control||{};
    const net=status.network||{},eth=info.network?.ethernet||{};
    const perf=status.performance||{},pmem=perf.memory||{};
    const pcpu=perf.cpu||{};
    const storage=perf.storage||{},flash=storage.flash||{},tf=storage.tf_card||{};
    const internal=pmem.internal||{},psram=pmem.psram||{};
    const ip=net.ip||eth.ipv4||"No IP";
    const speed=netSpeed(net,eth),duplex=netDuplex(net,eth);
    uptimeValue.textContent=info.uptime?.formatted||"--";
    ipValue.textContent=ip;
    const linkDetail=[speed,duplex].filter(Boolean).join(" · ");
    ipMeta.textContent=net.link_up?(linkDetail||"link up"):(linkDetail?`${linkDetail} · link down`:"link down");
    const loginCount=Number(info.auth?.login_count);
    loginCountValue.textContent=Number.isFinite(loginCount)&&loginCount>=0?String(Math.floor(loginCount)):"--";
    renderPreviewControl(!!vctl.preview_enabled,vctl.preview_mode);
    renderPower(power);
    perfCpu.textContent=pcpu.valid?fmtPercent(pcpu.usage_percent):"--";
    perfCpuMeta.textContent=pcpu.valid?(Number(pcpu.cores)>0?`${Number(pcpu.cores)} cores`:"核心数未知"):"warming up";
    const fpsActive=previewEnabled&&Number.isFinite(previewFps)&&previewFps>0;
    perfFps.textContent=fpsActive?previewFps.toFixed(previewFps%1?1:0):"--";
    perfFpsMetric.classList.toggle("ok",fpsActive);perfFpsMetric.classList.toggle("unknown",!fpsActive);
    perfFpsMetric.title=fpsActive?`${fmtMs(previewIntervalMs)} 刷新一次 · 独立于 KVM 采集模式`:"预览已关闭";
    const jpegSize=Number(video.last_jpeg_size||0),bitrateValue=jpegSize*8*previewFps/1000000,bitrateActive=previewEnabled&&jpegSize>0;
    perfBitrate.textContent=bitrateActive?fmtMbps(bitrateValue):"--";
    perfBitrateMetric.classList.toggle("ok",bitrateActive);perfBitrateMetric.classList.toggle("unknown",!bitrateActive);
    perfBitrateMetric.title=bitrateActive?`${fmtBytes(jpegSize)} / frame · 按预览 FPS 估算`:"暂无码率数据";
    perfSram.textContent=fmtBytes(internal.free_bytes);
    perfSramMeta.textContent=fmtUsageBytes(internal);
    perfPsram.textContent=psram.total_bytes?fmtBytes(psram.free_bytes):"N/A";
    perfPsramMeta.textContent=fmtUsageBytes(psram);
    perfFlash.textContent=flash.total_bytes?fmtPercent(flash.usage_percent):"N/A";
    perfFlashMeta.textContent=flash.total_bytes?`${fmtBytes(flash.used_bytes)} / ${fmtBytes(flash.total_bytes)} 已用`:"未检测到";
    perfTf.textContent=tf.mounted&&tf.total_bytes?fmtPercent(tf.usage_percent):"N/A";
    perfTfMeta.textContent=tf.mounted&&tf.total_bytes?`${fmtBytes(tf.used_bytes)} / ${fmtBytes(tf.total_bytes)} 已用`:(tf.last_error||"未插入或未挂载");
    renderExtraStorageDevices(storage.devices);
    setRing(ringCpu,pcpu.usage_percent,pcpu.valid);setRing(ringSram,internal.usage_percent,!!internal.total_bytes);setRing(ringPsram,psram.usage_percent,!!psram.total_bytes);setRing(ringFlash,flash.usage_percent,!!flash.total_bytes);setRing(ringTf,tf.usage_percent,!!(tf.mounted&&tf.total_bytes));
  }catch(e){console.error(e)}finally{updateBusy=false}
}
previewToggle.onchange=()=>setPreviewEnabled(previewToggle.checked);refreshShot.onclick=refreshSnapshot;
powerBtn.onclick=()=>powerAction("power");resetBtn.onclick=()=>powerAction("reset");holdPowerBtn.onclick=holdPowerAction;
locatorToggle.onchange=()=>setLocatorEnabled(locatorToggle.checked);
preview.onerror=()=>{preview.removeAttribute("src")};
UI.pageContext.register("overview",()=>{
  const status=UI.status.value||{},info=UI.info.value||{},video=status.video||{},network=status.network||{},power=status.power||{},performance=status.performance||{};
  return {summary:"Overview 设备运行摘要",items:[
    {kind:"status",label:"Network",value:network.ip||info.network?.ethernet?.ipv4||"No IP"},
    {kind:"status",label:"Video",value:video.frame_ready?`${video.width||0}×${video.height||0} @ ${Number(video.fps||0).toFixed(1)} fps`:video.device_connected?"standby":"offline"},
    {kind:"status",label:"Preview",value:video.control?.preview_enabled?"enabled":"disabled"},
    {kind:"status",label:"Power",value:power.busy?"busy":power.available?"available":"unavailable"},
    {kind:"metric",label:"CPU",value:performance.cpu?.valid?`${Number(performance.cpu.usage_percent||0).toFixed(1)}%`:"warming up"},
    {kind:"metric",label:"Uptime",value:info.uptime?.formatted||"--"},
  ]};
});
UI.lifecycle.addCleanup(()=>setPreviewLoop(false));
async function boot(){if(await AuthUI.checkRequired()){const [status,info]=await Promise.all([UI.status.refresh(),UI.info.refresh(),Session.load()]);await update(status,info);if(EMBEDDED_AGENT)await refreshAgentSummary()}UI.status.subscribe(status=>update(status,UI.info.value));UI.info.subscribe(info=>update(UI.status.value,info));UI.lifecycle.interval(()=>{if(!document.hidden&&!document.getElementById("authModal")?.classList.contains("show"))AuthUI.checkRequired()},10000);if(EMBEDDED_AGENT)UI.lifecycle.interval(()=>{if(!document.hidden)refreshAgentSummary()},2000)}
boot();
