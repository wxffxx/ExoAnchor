<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SI BMC ESP32-P4</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191b20;--panel2:#20232a;--line:#30343d;--text:#eef2f6;--muted:#96a0ad;--green:#2dd4bf;--red:#f87171;--yellow:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#15171b;position:sticky;top:0;z-index:2}.brand{display:flex;align-items:center;gap:12px}.logo{width:32px;height:32px;border:1px solid #4b5563;border-radius:6px;display:grid;place-items:center;font-weight:800;background:#20242c}.title{font-weight:700}.sub{font-size:12px;color:var(--muted);margin-top:-2px}.nav{display:flex;gap:8px}.nav a{color:var(--muted);text-decoration:none;padding:7px 10px;border-radius:6px}.nav a.active,.nav a:hover{background:var(--panel2);color:var(--text)}.badge{font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:6px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.badge.ok{color:var(--green);border-color:#1f766d}.badge.bad{color:var(--red);border-color:#7f2d2d}.wrap{max-width:1280px;margin:0 auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}.card h2{font-size:14px;margin:0 0 12px;color:#d7dce3}.label{color:var(--muted);font-size:12px}.value{font:700 24px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace}.small{font-size:12px;color:var(--muted);margin-top:8px;word-break:break-word}.rows{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:14px;padding:9px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:6px}.row b{font-weight:600}.dot{width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block;margin-right:7px}.dot.ok{background:var(--green)}button{border:1px solid var(--line);background:#242832;color:var(--text);border-radius:6px;padding:10px 12px;cursor:pointer;font-weight:650}button:hover{border-color:#59606d;background:#2a303b}.preview{display:block;width:100%;aspect-ratio:16/9;background:#050506;border:1px solid var(--line);border-radius:6px;object-fit:contain}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.log{height:230px;overflow:auto;background:#0c0d10;border:1px solid var(--line);border-radius:6px;padding:10px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.log div{display:grid;grid-template-columns:62px 58px 1fr;gap:8px;border-bottom:1px solid #1c1f25;padding:4px 0}.linkcard{display:block;color:inherit;text-decoration:none}.linkcard:hover{border-color:#59606d}@media(max-width:900px){.grid,.grid2{grid-template-columns:1fr}.top{height:auto;align-items:flex-start;gap:12px;padding:14px;flex-direction:column}}
</style>
</head>
<body>
<nav class="top">
  <div class="brand"><div class="logo">SI</div><div><div class="title">SI BMC ESP32-P4</div><div class="sub">Waveshare ESP32-P4-NANO</div></div></div>
  <div class="nav"><a class="active" href="/">Dashboard</a><a href="/kvm">KVM</a></div>
  <span id="videoBadge" class="badge">CHECKING</span>
</nav>
<main class="wrap">
  <section class="grid">
    <div class="card"><div class="label">Chip</div><div id="chip" class="value">ESP32-P4</div><div id="uptime" class="small">--</div></div>
    <div class="card"><div class="label">Free Heap</div><div id="heap" class="value">--</div><div id="minheap" class="small">--</div></div>
    <div class="card"><div class="label">Video</div><div id="videoRes" class="value">--</div><div id="videoMeta" class="small">--</div></div>
    <a class="card linkcard" href="/kvm"><div class="label">KVM</div><div id="clients" class="value">0</div><div class="small">active HID clients</div></a>
  </section>
  <section class="grid2">
    <div class="card">
      <h2>视频输入</h2>
      <img id="preview" class="preview" alt="" src="/api/snapshot">
      <div class="actions"><button id="refreshShot">Refresh</button><button id="quality60">Q60</button><button id="quality75">Q75</button><button id="quality90">Q90</button></div>
    </div>
    <div class="card">
      <h2>HID / 视频状态</h2>
      <div class="rows" id="devices"></div>
    </div>
  </section>
  <section class="grid2">
    <div class="card">
      <h2>网络</h2>
      <div class="rows" id="network"></div>
    </div>
    <div class="card">
      <h2>控制接口</h2>
      <div class="rows" id="bridge"></div>
    </div>
  </section>
  <section class="card" style="margin-top:14px">
    <h2>日志</h2>
    <div id="logs" class="log"></div>
  </section>
</main>
<script>
const API={token:localStorage.getItem("si_token")||"",async req(method,path,body){const h={"Content-Type":"application/json"};if(this.token)h.Authorization="Bearer "+this.token;const r=await fetch(path,{method,headers:h,body:body?JSON.stringify(body):undefined});if(r.status===401){const p=prompt("Password","admin");if(p){this.token=p;localStorage.setItem("si_token",p);return this.req(method,path,body)}}if(!r.ok)throw new Error(await r.text());return r.json()},get(p){return this.req("GET",p)},post(p,b){return this.req("POST",p,b)}};
function row(name,value,ok){return `<div class="row"><b><span class="dot ${ok?"ok":""}"></span>${name}</b><span>${value}</span></div>`}
function fmtBytes(n){if(!n)return"--";if(n>1048576)return Math.round(n/1048576)+" MB";return Math.round(n/1024)+" KB"}
async function setQuality(q){await API.post("/api/video/quality",{quality:q});await update();refreshSnapshot()}
function refreshSnapshot(){preview.src="/api/snapshot?t="+Date.now()}
async function update(){
  try{
    const [info,status,logData]=await Promise.all([API.get("/api/system/info"),API.get("/api/status"),API.get("/api/system/logs?n=60")]);
    chip.textContent="ESP32-P4";uptime.textContent="Uptime "+(info.uptime?.formatted||"--");
    heap.textContent=fmtBytes(info.memory?.free_bytes);minheap.textContent="min "+fmtBytes(info.memory?.minimum_free_bytes);
    clients.textContent=status.active_connections||0;
    const hid=status.hid||{},video=status.video||{};
    videoRes.textContent=video.connected?video.resolution:"--";
    videoMeta.textContent=video.connected?`${Number(video.fps||0).toFixed(1)} fps · ${fmtBytes(video.last_jpeg_size)} · Q${video.quality}`:(video.last_error||"waiting");
    videoBadge.textContent=video.connected?"VIDEO ONLINE":"NO VIDEO";videoBadge.className="badge "+(video.connected?"ok":"bad");
    devices.innerHTML=row("USB HID",hid.connected?"mounted":"waiting",hid.connected)+row("Keyboard",hid.keyboard?.available?"ready":"off",hid.keyboard?.available)+row("Mouse",hid.mouse?.available?"ready":"off",hid.mouse?.available)+row("CSI video",video.connected?`${video.frames_encoded} frames`:"waiting",video.connected);
    const net=status.network||{};network.innerHTML=row("Interface",net.interface||"ethernet",net.configured)+row("Ethernet link",net.link_up?"up":"down",net.link_up)+row("DHCP",net.connected?"leased":"waiting",net.connected)+row("IP",net.ip||"No IP",net.connected)+row("Gateway",net.gateway||"--",net.connected)+row("MAC",net.mac||"--",true);
    const caps=status.control_bridge?.capabilities||{};bridge.innerHTML=Object.entries(caps).map(([k,v])=>row(k.replaceAll("_"," "),v?"READY":"OFF",v)).join("");
    const logs=logData.logs||[];document.getElementById("logs").innerHTML=logs.map(l=>`<div><span>${l.time}</span><span>${l.level}</span><span>${l.message}</span></div>`).join("");
  }catch(e){console.error(e)}
}
refreshShot.onclick=refreshSnapshot;quality60.onclick=()=>setQuality(60);quality75.onclick=()=>setQuality(75);quality90.onclick=()=>setQuality(90);
preview.onerror=()=>{preview.removeAttribute("src")};
update();setInterval(update,2000);setInterval(refreshSnapshot,5000);
</script>
</body>
</html>
