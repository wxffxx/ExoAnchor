[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exoanchor-toolkit"
version = "0.1.0"
description = "ExoAnchor provisioning and precompiled firmware utility"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5,<4",
  "esptool>=4.7,<6",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
exoanchor-toolkit = "exoanchor_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["exoanchor_toolkit*"]

[tool.setuptools.package-data]
exoanchor_toolkit = ["toolkit_ui.html", "THIRD_PARTY_NOTICES.txt"]
